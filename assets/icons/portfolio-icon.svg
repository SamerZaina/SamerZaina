<svg xmlns="http://www.w3.org/2000/svg" width="190" height="48" viewBox="0 0 190 48" role="img" aria-label="Portfolio">
  <title>Portfolio</title>
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0709"/>
      <stop offset="1" stop-color="#1a0b0d"/>
    </linearGradient>
    <linearGradient id="bd" x1="0" x2="1">
      <stop offset="0" stop-color="#ff3b1f"/>
      <stop offset="1" stop-color="#ff6a3c"/>
    </linearGradient>
    <radialGradient id="fl" cx="50%" cy="70%" r="60%">
      <stop offset="0" stop-color="#fff6c0"/>
      <stop offset="0.4" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#ff3b1f"/>
    </radialGradient>
  </defs>

  <rect x="2" y="2" width="186" height="44" rx="12" fill="#ff1a1a" opacity="0.25" filter="url(#soft)">
    <animate attributeName="opacity" values="0.15;0.4;0.15" dur="2.4s" repeatCount="indefinite"/>
  </rect>
  <rect x="1.5" y="1.5" width="187" height="45" rx="12" fill="url(#bg)" stroke="url(#bd)" stroke-width="1.5"/>

  <!-- flame -->
  <g transform="translate(25,24) scale(0.46)">
    <path d="M0,-38 C6,-22 24,-12 24,12 C24,30 12,40 0,40 C-12,40 -24,30 -24,12 C-24,-2 -14,-10 -10,-22 C-6,-14 -4,-10 -2,-6 C2,-16 0,-28 0,-38 Z" fill="none" stroke="#ff3b1f" stroke-width="4" filter="url(#glow)"/>
    <path d="M0,-6 C5,2 14,8 14,20 C14,30 8,36 0,36 C-8,36 -14,30 -14,20 C-14,10 -6,6 0,-6 Z" fill="url(#fl)" filter="url(#glow)"/>
  </g>

  <text x="46" y="29.5" font-family="'Courier New', Courier, monospace" font-size="15" font-weight="700" letter-spacing="2.5" fill="#ff6a3c" filter="url(#glow)">PORTFOLIO</text>
  <path d="M172,19 L177,24 L172,29 L167,24 Z" fill="#ff3b1f" filter="url(#glow)"/>
</svg>
