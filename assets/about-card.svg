<svg xmlns="http://www.w3.org/2000/svg" width="820" height="400" viewBox="0 0 820 400">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="edge" x1="0" x2="1">
      <stop offset="0" stop-color="#ff2a2a" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ff6a1f"/>
      <stop offset="1" stop-color="#ff2a2a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tag" x1="0" x2="1">
      <stop offset="0" stop-color="#3a0b0b"/>
      <stop offset="1" stop-color="#1a0607"/>
    </linearGradient>
    <radialGradient id="aura" cx="85%" cy="10%" r="70%">
      <stop offset="0" stop-color="#ff3a14" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#0b0709" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="820" height="400" rx="16" fill="#0b0709"/>
  <rect width="820" height="400" rx="16" fill="url(#aura)"/>
  <rect x="1" y="1" width="818" height="398" rx="15" fill="none" stroke="#2a0d0d"/>
  <line x1="30" y1="1" x2="790" y2="1" stroke="url(#edge)" stroke-width="2"/>
  <line x1="30" y1="399" x2="790" y2="399" stroke="url(#edge)" stroke-width="2"/>

  <!-- ROW 1 -->
  <g>
    <polygon points="24,24 124,24 140,48 124,72 24,72 40,48" fill="url(#tag)" stroke="#ff4d2e" stroke-width="1.5" filter="url(#glow)"><animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/></polygon>
    <text x="82" y="53" text-anchor="middle" font-family="'Courier New',monospace" font-size="15" font-weight="bold" letter-spacing="3" fill="#ff5a2e">EDU</text>
    <text x="164" y="46" font-family="'Courier New',monospace" font-size="17" font-weight="bold" fill="#ff7a4a">B.Sc. Computer Engineering</text>
    <text x="164" y="66" font-family="'Courier New',monospace" font-size="13" fill="#d8b4a6">Islamic University of Gaza · 2020 – 2026</text>
    <line x1="24" y1="84" x2="796" y2="84" stroke="#ff3b1f" stroke-opacity="0.35" stroke-dasharray="4 8"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.5s" repeatCount="indefinite"/></line>
  </g>

  <!-- ROW 2 -->
  <g>
    <polygon points="24,94 124,94 140,118 124,142 24,142 40,118" fill="url(#tag)" stroke="#ff4d2e" stroke-width="1.5" filter="url(#glow)"><animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3s" begin="0.5s" repeatCount="indefinite"/></polygon>
    <text x="82" y="123" text-anchor="middle" font-family="'Courier New',monospace" font-size="15" font-weight="bold" letter-spacing="3" fill="#ff5a2e">ROLE</text>
    <text x="164" y="116" font-family="'Courier New',monospace" font-size="17" font-weight="bold" fill="#ff7a4a">Mobile Application Developer</text>
    <text x="164" y="136" font-family="'Courier New',monospace" font-size="13" fill="#d8b4a6">High-performance cross-platform apps with Flutter &amp; Dart</text>
    <line x1="24" y1="154" x2="796" y2="154" stroke="#ff3b1f" stroke-opacity="0.35" stroke-dasharray="4 8"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.5s" repeatCount="indefinite"/></line>
  </g>

  <!-- ROW 3 -->
  <g>
    <polygon points="24,164 124,164 140,188 124,212 24,212 40,188" fill="url(#tag)" stroke="#ff4d2e" stroke-width="1.5" filter="url(#glow)"><animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3s" begin="1s" repeatCount="indefinite"/></polygon>
    <text x="82" y="193" text-anchor="middle" font-family="'Courier New',monospace" font-size="15" font-weight="bold" letter-spacing="3" fill="#ff5a2e">ARCH</text>
    <text x="164" y="186" font-family="'Courier New',monospace" font-size="17" font-weight="bold" fill="#ff7a4a">Clean Architecture &amp; Scalable Systems</text>
    <text x="164" y="206" font-family="'Courier New',monospace" font-size="13" fill="#d8b4a6">Maintainable software with BLoC/Cubit &amp; advanced state management</text>
    <line x1="24" y1="224" x2="796" y2="224" stroke="#ff3b1f" stroke-opacity="0.35" stroke-dasharray="4 8"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.5s" repeatCount="indefinite"/></line>
  </g>

  <!-- ROW 4 -->
  <g>
    <polygon points="24,234 124,234 140,258 124,282 24,282 40,258" fill="url(#tag)" stroke="#ff4d2e" stroke-width="1.5" filter="url(#glow)"><animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3s" begin="1.5s" repeatCount="indefinite"/></polygon>
    <text x="82" y="263" text-anchor="middle" font-family="'Courier New',monospace" font-size="15" font-weight="bold" letter-spacing="3" fill="#ff5a2e">AI</text>
    <text x="164" y="256" font-family="'Courier New',monospace" font-size="17" font-weight="bold" fill="#ff7a4a">AI &amp; Tech Integration</text>
    <text x="164" y="276" font-family="'Courier New',monospace" font-size="13" fill="#d8b4a6">Deep learning for vision systems, REST APIs &amp; Firebase backends</text>
    <line x1="24" y1="294" x2="796" y2="294" stroke="#ff3b1f" stroke-opacity="0.35" stroke-dasharray="4 8"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.5s" repeatCount="indefinite"/></line>
  </g>

  <!-- ROW 5 : philosophy -->
  <g>
    <polygon points="24,304 124,304 140,328 124,352 24,352 40,328" fill="url(#tag)" stroke="#ff4d2e" stroke-width="1.5" filter="url(#glow)"><animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3s" begin="2s" repeatCount="indefinite"/></polygon>
    <text x="82" y="333" text-anchor="middle" font-family="'Courier New',monospace" font-size="15" font-weight="bold" letter-spacing="3" fill="#ff5a2e">CODE</text>
    <text x="164" y="326" font-family="'Courier New',monospace" font-size="17" font-weight="bold" fill="#ff7a4a">Philosophy</text>
    <text x="164" y="346" font-family="'Courier New',monospace" font-size="13" font-style="italic" fill="#ffb08a">"Great software is invisible — it just works powerfully and beautifully"</text>
  </g>

  <!-- energy ticker -->
  <rect x="24" y="378" width="60" height="2" fill="#ff5a2a" filter="url(#glow)">
    <animate attributeName="x" values="24;736;24" dur="6s" repeatCount="indefinite"/>
  </rect>
</svg>
