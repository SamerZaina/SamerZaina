name: Generate Dragon Snake & Streak

on:
  schedule:
    - cron: "0 0 * * *" # runs once a day
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate dragon animation & streak from GitHub contributions
        env:
          GH_USER: SamerZaina
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUT: dist/dragon-snake.svg
          OUT_STREAK: dist/dragon-streak.svg
        run: node .github/scripts/dragon-snake.mjs

      - name: Push dragon assets to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
